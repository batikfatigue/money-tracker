<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Money Tracker</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <header>
    <h1>Money Tracker</h1>
    <form id="import-form" class="import">
      <label class="file-label">
        <input type="file" id="csv-file" name="file" accept=".csv,text/csv" required />
        <span id="file-name">Choose CSV…</span>
      </label>
      <button type="submit" id="import-btn">Import</button>
      <button type="button" id="clear-btn" class="danger">Clear all</button>
    </form>
  </header>

  <div id="status" class="status" hidden></div>

  <section class="filters">
    <label>From <input type="date" id="start" /></label>
    <label>To <input type="date" id="end" /></label>
    <label>Category
      <select id="category"><option value="">All</option></select>
    </label>
    <button type="button" id="reset-filters">Reset</button>
  </section>

  <section class="cards">
    <div class="card"><div class="label">Expenses</div><div class="value expense" id="total-expenses">$0.00</div></div>
    <div class="card"><div class="label">Income</div><div class="value income" id="total-income">$0.00</div></div>
    <div class="card"><div class="label">Net</div><div class="value" id="total-net">$0.00</div></div>
    <div class="card"><div class="label">Transactions</div><div class="value" id="total-count">0</div></div>
  </section>

  <section class="charts">
    <div class="chart-box"><h2>Spending by category</h2><canvas id="category-chart"></canvas></div>
    <div class="chart-box"><h2>Monthly overview</h2><canvas id="month-chart"></canvas></div>
  </section>

  <section class="table-box">
    <h2>Transactions <span id="table-count" class="muted"></span></h2>
    <table id="transactions">
      <thead>
        <tr><th>Date</th><th>Payee</th><th>Category</th><th>Tags</th><th>Notes</th><th class="num">Amount</th></tr>
      </thead>
      <tbody></tbody>
    </table>
    <p id="empty" class="muted" hidden>No transactions yet. Import a CSV (Lunch Money format: <code>date, payee, amount, notes, categories, tags</code>) to get started.</p>
  </section>

  <script src="/static/app.js"></script>
</body>
</html>
