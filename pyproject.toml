[tool.poetry]
name = "money-tracker"
version = "0.1.0"
description = "Personal money tracker with Lunch Money-style CSV import"
authors = ["batikfatigue"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
fastapi = ">=0.110,<1"
uvicorn = {extras = ["standard"], version = ">=0.29,<1"}
python-multipart = ">=0.0.9"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
